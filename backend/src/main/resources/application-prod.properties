# ============================================================
# PRODUCTION PROFILE — application-prod.properties
#
# Activate with: SPRING_PROFILES_ACTIVE=prod (or docker-compose env)
#
# ALL sensitive values come from environment variables.
# No hardcoded secrets in this file.
# ============================================================

# ===============================
# DATABASE (Production MySQL)
# ===============================
# useSSL=true is REQUIRED in production for encrypted connections.
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:placement_db}?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool tuning (HikariCP) for production workloads
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ===============================
# JPA / HIBERNATE
# ===============================
# ddl-auto=update safely adds missing columns/tables without deleting existing data
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===============================
# SERVER & FRONTEND URL
# ===============================
server.port=${SERVER_PORT:8080}
app.frontend-url=${APP_FRONTEND_URL:https://campus-job-amber.vercel.app}
# Only expose our API in production (no default error page details)
server.error.include-stacktrace=never
server.error.include-message=never

# ===============================
# CORS (allowed frontend origins)
# ===============================
# Comma-separated list of allowed origins. Must be set in production to the real
# frontend origin(s). Never use "*" with credentials.
CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:https://campus-job-amber.vercel.app,http://localhost:3000,http://localhost:5173}

# ===============================
# LOGIN / REGISTRATION RATE LIMITING
# ===============================
# In-memory guards (single-instance protection). For multi-instance, use a shared store.
app.login.max-attempts=${MAX_LOGIN_ATTEMPTS:5}
app.login.lockout-minutes=${LOCKOUT_MINUTES:15}
app.registration.max-per-window=${MAX_REGISTRATIONS_PER_WINDOW:3}
app.registration.window-minutes=${REGISTRATION_WINDOW_MINUTES:60}

# ===============================
# JWT (from secrets manager / environment)
# ===============================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# MAIL (SMTP)
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
management.health.mail.enabled=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ===============================
# ACTUATOR (health checks + monitoring)
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Don't leak sensitive info in non-HTTPS environments
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState

# ===============================
# SWAGGER / OPENAPI
# ===============================
# In production, disable Swagger UI or protect it behind auth.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# ===============================
# LOGGING (production best practices)
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.com.placement=INFO

# JSON logs (won't affect non-JSON log collectors, harmless if unused)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n


# ============================================================
# PRODUCTION PROFILE — application-prod.properties
#
# Activate with: SPRING_PROFILES_ACTIVE=prod
#
# Sensitive values must come from environment variables.
# No production secrets are hardcoded in this file.
# ============================================================


# ============================================================
# DATABASE — PRODUCTION MYSQL
# ============================================================
# SSL is required for production database connections.
# Supports direct JDBC URLs or individual database settings.

spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:placement_db}?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000


# ============================================================
# JPA / HIBERNATE
# ============================================================
# Preserve existing data. Use controlled database migrations
# for future production schema changes.

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false


# ============================================================
# SERVER AND FRONTEND URL
# ============================================================

server.port=${SERVER_PORT:8080}
app.frontend-url=${APP_FRONTEND_URL:https://campus-job-amber.vercel.app}

# Avoid exposing stack traces or exception messages in responses.
server.error.include-stacktrace=never
server.error.include-message=never


# ============================================================
# CORS — CROSS-ORIGIN RESOURCE SHARING
# ============================================================
# IMPORTANT:
# Use a separate Spring property to avoid circular placeholders.
# Override CORS_ALLOWED_ORIGINS through Render when needed.

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://campus-job-amber.vercel.app,http://localhost:3000,http://localhost:5173}


# ============================================================
# LOGIN AND REGISTRATION RATE LIMITING
# ============================================================
# In-memory protection is suitable for a single application
# instance. Consider a shared store for multiple instances.

app.login.max-attempts=${MAX_LOGIN_ATTEMPTS:5}
app.login.lockout-minutes=${LOCKOUT_MINUTES:15}

app.registration.max-per-window=${MAX_REGISTRATIONS_PER_WINDOW:3}
app.registration.window-minutes=${REGISTRATION_WINDOW_MINUTES:60}


# ============================================================
# JWT AUTHENTICATION
# ============================================================
# JWT_SECRET is mandatory when the production profile is active.
# Configure a strong, randomly generated secret in Render.

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ============================================================
# FIREBASE PROJECT CONFIGURATION
# ============================================================

app.firebase.project-id=${FIREBASE_PROJECT_ID:}


# ============================================================
# EMAIL / SMTP
# ============================================================
# Supply valid SMTP credentials to enable real email delivery.
# The application should handle optional email configuration
# without crashing during startup.

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:noreply@campusjob.com}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Exclude the optional mail subsystem from health status.
management.health.mail.enabled=false


# ============================================================
# ACTUATOR — HEALTH CHECKS AND MONITORING
# ============================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState


# ============================================================
# SWAGGER / OPENAPI
# ============================================================
# Disabled by default in production.
# Enable only when appropriate for your deployment.

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}


# ============================================================
# PRODUCTION LOGGING
# ============================================================

logging.level.root=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.com.placement=INFO

# Console log format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n

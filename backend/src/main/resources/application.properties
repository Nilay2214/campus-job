# ===============================
# DATABASE CONFIGURATION
# ===============================
# All values are overridable via environment variables (Set in docker-compose.yml / .env).
# Defaults here allow local development out-of-the-box. NO secrets are committed.
# DB_PASSWORD is REQUIRED and has no default: the app fails fast at startup if it is missing.

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:placement_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# In production, override to "validate" or "none" once migrations are in place.
# See the AAPLICATION_DDL_AUTO env var in docker-compose.yml.

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# SERVER
# ===============================

server.port=${SERVER_PORT:8080}

# ===============================
# LOGIN RATE LIMITING / LOCKOUT
# ===============================
# Simple in-memory lockout after repeated failed login attempts.
app.login.max-attempts=${MAX_LOGIN_ATTEMPTS:5}
app.login.lockout-minutes=${LOCKOUT_MINUTES:15}

# ===============================
# REGISTRATION RATE LIMITING
# ===============================
# Simple in-memory guard against mass account creation (single-instance protection).
app.registration.max-per-window=${MAX_REGISTRATIONS_PER_WINDOW:3}
app.registration.window-minutes=${REGISTRATION_WINDOW_MINUTES:60}

# ===============================
# ===============================
# PASSWORD RESET & FRONTEND URL
# ===============================
# Validity window for a single password-reset token (minutes).
app.password-reset.token-ttl-minutes=${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# ===============================
# GOOGLE OAUTH2 / OIDC CONFIGURATION
# ===============================
# Configured dynamically via OAuth2ClientConfig using environment variables:
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REDIRECT_URI
app.firebase.project-id=${FIREBASE_PROJECT_ID:}

# ===============================
# MOBILE NUMBER & OTP CONFIGURATION
# ===============================
app.otp.ttl-minutes=${OTP_TTL_MINUTES:5}
app.otp.cooldown-seconds=${OTP_COOLDOWN_SECONDS:60}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:3}
app.otp.max-requests-per-hour=${OTP_MAX_REQUESTS_PER_HOUR:5}
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# ===============================
# JWT CONFIGURATION
# ===============================
# IMPORTANT: The default below is a WELL-KNOWN DEVELOPMENT-ONLY key. It is NEVER to be used
# in production. Production MUST set JWT_SECRET via an environment variable (see
# docker-compose.prod.yml, which requires ${JWT_SECRET} with no default). The dev default
# exists only so the application context can load for local development and unit tests.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# MAIL CONFIGURATION
# ===============================
# Override via env vars in production (MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM).
# No real credentials are committed. Emailing works with local SMTP (Mailpit/MailHog) or production SMTP.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:noreply@campusjob.com}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}

# SMTP is intentionally disabled by default (no credentials). Exclude the mail
# health indicator so /actuator/health reflects app + DB status, not optional SMTP.
management.health.mail.enabled=false

# ===============================
# UPLOADS (resume storage)
# ===============================
uploads.resume-dir=${RESUME_DIR:./uploads/resumes}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:6MB}

# ===============================
# LOGGING
# ===============================

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG:DEBUG}
logging.level.org.hibernate.orm.jdbc.bind=TRACE


# ============================================================
# DATABASE CONFIGURATION
# ============================================================
# Values can be overridden using environment variables.
# DB_PASSWORD or SPRING_DATASOURCE_PASSWORD is required.
# EnvConfigValidator validates required credentials at startup.

spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:placement_db}?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================
# Preserve existing database tables and records.
# Use database migrations for controlled production schema changes.

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.open-in-view=false


# ============================================================
# CORS CONFIGURATION
# IMPORTANT: Do not reference CORS_ALLOWED_ORIGINS as the
# property name on the left side. That creates a circular
# placeholder reference.
# ============================================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://campus-job-amber.vercel.app,http://localhost:3000,http://localhost:5173}


# ============================================================
# SERVER CONFIGURATION
# ============================================================

server.port=${SERVER_PORT:8080}


# ============================================================
# LOGIN RATE LIMITING / LOCKOUT
# ============================================================

app.login.max-attempts=${MAX_LOGIN_ATTEMPTS:5}
app.login.lockout-minutes=${LOCKOUT_MINUTES:15}


# ============================================================
# REGISTRATION RATE LIMITING
# ============================================================

app.registration.max-per-window=${MAX_REGISTRATIONS_PER_WINDOW:3}
app.registration.window-minutes=${REGISTRATION_WINDOW_MINUTES:60}


# ============================================================
# PASSWORD RESET AND FRONTEND URL
# ============================================================

app.password-reset.token-ttl-minutes=${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
app.frontend-url=${APP_FRONTEND_URL:https://campus-job-amber.vercel.app}


# ============================================================
# FIREBASE PROJECT CONFIGURATION
# ============================================================

app.firebase.project-id=${FIREBASE_PROJECT_ID:}


# ============================================================
# GOOGLE OAUTH2 / OIDC CONFIGURATION
# ============================================================
# OAuth client settings are configured through the application's
# OAuth2ClientConfig and environment variables.

# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# GOOGLE_REDIRECT_URI


# ============================================================
# MOBILE NUMBER / OTP CONFIGURATION
# ============================================================

app.otp.ttl-minutes=${OTP_TTL_MINUTES:5}
app.otp.cooldown-seconds=${OTP_COOLDOWN_SECONDS:60}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:3}
app.otp.max-requests-per-hour=${OTP_MAX_REQUESTS_PER_HOUR:5}

app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.phone-number=${TWILIO_PHONE_NUMBER:}


# ============================================================
# JWT CONFIGURATION
# ============================================================
# The default secret is for local development only.
# Always configure a strong JWT_SECRET in Render.

app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ============================================================
# EMAIL / SMTP CONFIGURATION
# ============================================================
# Real email delivery requires valid SMTP credentials.
# The application must handle optional email configuration safely.

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:noreply@campusjob.com}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}

# SMTP is optional. Do not let its health indicator alone
# make the application appear unhealthy.
management.health.mail.enabled=false


# ============================================================
# FILE UPLOADS / RESUME STORAGE
# ============================================================

uploads.resume-dir=${RESUME_DIR:./uploads/resumes}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:6MB}


# ============================================================
# LOGGING
# ============================================================
# Avoid logging SQL parameter values by default.
# Enable detailed SQL logging only when needed for debugging.

logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG:INFO}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG:WARN}

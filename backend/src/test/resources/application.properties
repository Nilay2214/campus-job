# ===============================
# TEST CONFIGURATION
# ===============================
# Provides a harmless in-memory H2 database + dummy values so @SpringBootTest
# tests can load the full application context without a real MySQL instance.
# No production secrets are used here.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=test

# Provide DB_PASSWORD so EnvConfigValidator passes in tests (never used for real connections).
DB_PASSWORD=test

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=0

# Test-safe JWT secret (dev only, never used in production).
app.jwt.secret=test-only-insecure-secret-not-for-production-0000000000
app.jwt.expiration-ms=86400000

app.login.max-attempts=5
app.login.lockout-minutes=15
app.registration.max-per-window=3
app.registration.window-minutes=60
app.password-reset.token-ttl-minutes=30

uploads.resume-dir=./target/test-uploads

# Disable mail for tests.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=

management.endpoints.web.exposure.include=health,info

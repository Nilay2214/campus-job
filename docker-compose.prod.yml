# ============================================================
# PRODUCTION DOCKER COMPOSE
# 
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Differences from docker-compose.yml:
#   - Uses application-prod.properties via SPRING_PROFILES_ACTIVE=prod
#   - Production nginx config with HTTPS support
#   - No port exposure on DB (internal only)
#   - Restart: always
# ============================================================

version: "3.8"

networks:
  placement-network:
    driver: bridge

volumes:
  placement-mysql-data:
    driver: local

services:
  # ==========================================================
  # MySQL (Production)
  # ==========================================================
  mysql:
    image: mysql:8.0
    container_name: placement-mysql-prod
    hostname: mysql
    restart: always
    networks:
      - placement-network
    volumes:
      - placement-mysql-data:/var/lib/mysql
      # Optional: mount an init script for schema
      # - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-placement_db}
      MYSQL_USER: ${DB_USERNAME:-placement_app}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ==========================================================
  # Backend (Spring Boot)
  # ==========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placement-backend-prod
    hostname: backend
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - placement-network
    restart: always
    environment:
      # Spring profile
      SPRING_PROFILES_ACTIVE: prod
      # Database
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-placement_db}
      DB_USERNAME: ${DB_USERNAME:-placement_app}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX: 20
      DB_POOL_MIN: 5
      DDL_AUTO: ${DDL_AUTO:-validate}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      # Mail
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # Server
      SERVER_PORT: 8080
      # Swagger (disable in prod)
      SWAGGER_ENABLED: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ==========================================================
  # Frontend (React + Nginx)
  # ==========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: placement-frontend-prod
    hostname: frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - placement-network
    restart: always
    ports:
      - "80:80"
      - "443:443"  # HTTPS (requires certs mounted)
    volumes:
      # Mount SSL certs from the host (optional, only if using HTTPS directly with nginx)
      - ${SSL_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
